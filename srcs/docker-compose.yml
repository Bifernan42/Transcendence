version: '3.8'
services:
  django:
    container_name: django
    build: ./requirements/django
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:admin_password@postgres:5432/transcendencedb
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./requirements/django:/app
    networks:
      - transcendence

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: transcendencedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d transcendencedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  pong:
    container_name: pong
    build: ./requirements/pong
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgresql://admin:admin_password@postgres:5432/transcendencedb
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence

volumes:
  postgres_data:

networks:
  transcendence:
